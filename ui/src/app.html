<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" name="viewport">
    <meta content="scale" name="text-scale">
    <link href="%sveltekit.assets%/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="%sveltekit.assets%/manifest.webmanifest" rel="manifest">
    <link href="%sveltekit.assets%/apple-touch-icon.png" rel="apple-touch-icon">
    <meta content="Dragonfly" name="apple-mobile-web-app-title">
    <title>Dragonfly</title>
    <meta content="#f3f4f7" media="(prefers-color-scheme: light)" name="theme-color">
    <meta content="#0d0e11" media="(prefers-color-scheme: dark)" name="theme-color">
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
